<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kokuro Site Header</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./theme/human.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.kh{position:sticky;top:0;z-index:30;background:rgba(11,11,11,.96);border-bottom:1px solid var(--k-accent);font-family:var(--k-font-body);color:var(--k-ink)}
.kh *{box-sizing:border-box}
.kh-in{position:relative;max-width:var(--k-max);margin:0 auto;padding:0 var(--k-gutter);min-height:70px;display:flex;align-items:center;gap:28px}
.kh-logo{display:flex;align-items:center;gap:14px;background:none;border:0;padding:0;min-height:44px}
.kh-wm{font-family:var(--k-font-display);font-style:italic;font-size:46px;line-height:1;color:var(--k-ink);-webkit-text-stroke:1.4px var(--k-ink)}
.kh-slash{width:4px;height:34px;background:var(--k-accent);transform:skewX(-18deg)}
.kh-sub{font-size:12px;font-weight:700;letter-spacing:.55em;color:var(--k-ink)}
.kh-menu{display:flex;align-items:center;gap:24px;margin-left:auto}
.kh-nav{display:flex;align-items:center;gap:8px}
.kh-link{position:relative;min-height:44px;padding:0 16px;background:none;border:0;font-size:14px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--k-ink);transform:skewX(var(--k-skew))}
.kh-link>span{display:block;transform:skewX(calc(var(--k-skew) * -1))}
.kh-link::after{content:"";position:absolute;left:16px;right:16px;bottom:6px;height:3px;background:var(--k-accent);transform:scaleX(0);transform-origin:left;transition:transform .25s ease}
.kh-link:hover::after{transform:scaleX(1)}
.kh-link[aria-current="page"]{background:var(--k-accent);color:var(--k-on-accent)}
.kh-link[aria-current="page"]::after{display:none}
.kh-search{position:relative;width:250px}
.kh-search input{width:100%;min-height:44px;padding:0 14px 0 42px;background:transparent;border:1px solid var(--k-line-strong);color:var(--k-ink);font:500 14px var(--k-font-body)}
.kh-search input::placeholder{color:var(--k-muted)}
.kh-search input:focus{border-color:var(--k-ink)}
.kh-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);pointer-events:none}
.kh-icon{position:relative;width:46px;height:46px;display:inline-flex;align-items:center;justify-content:center;background:none;border:0;padding:0;color:var(--k-ink)}
.kh-icon:hover{color:var(--k-accent-text)}
.kh-count{position:absolute;top:2px;right:0;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--k-accent);color:var(--k-on-accent);font-size:11px;font-weight:800;line-height:20px;text-align:center}
.kh-burger{display:none}
.kh-mode{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;background:none;border:1px solid var(--k-line-strong);color:var(--k-ink);font:700 12px var(--k-font-body);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.kh-mode:hover{border-color:var(--k-accent);color:var(--k-accent-text)}
.kh-cartwrap{border-left:1px solid var(--k-line);padding-left:14px}
.kh button:focus-visible,.kh input:focus-visible{outline:3px solid var(--k-ink);outline-offset:3px}
@media (max-width:900px){
.kh-in{gap:8px;min-height:62px}
.kh-wm{font-size:38px}.kh-slash,.kh-sub{display:none}
.kh-cartwrap{border-left:0;padding-left:0}
.kh-mode{margin-left:auto;padding:0 10px}
.kh-mode img{display:none}
.kh-cartwrap{margin-left:auto}
.kh-mode + .kh-cartwrap{margin-left:0}
.kh-burger{display:inline-flex}
.kh-menu{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;align-items:stretch;gap:18px;margin:0;padding:20px var(--k-gutter) 26px;background:var(--k-bg);border-bottom:2px solid var(--k-accent)}
.kh-menu.kh-open{display:flex}
.kh-nav{flex-direction:column;align-items:stretch;gap:2px}
.kh-link{min-height:54px;padding:0 14px;text-align:left;font-family:var(--k-font-display);font-style:italic;font-weight:400;font-size:34px;letter-spacing:.04em;transform:none}
.kh-link>span{transform:none}
.kh-link::after{display:none}
.kh-search{width:100%}
}
</style>
</helmet>
<header class="kh k-root" style="min-height: 0">
<div class="kh-in">
<button class="kh-logo" onClick="{{ goHome }}" aria-label="Kokuro Customs, home">
<span class="kh-wm">KOKURO</span><span class="kh-slash"></span><span class="kh-sub">CUSTOMS</span>
</button>
<div class="kh-menu {{ menuCls }}" id="kh-menu">
<nav class="kh-nav" aria-label="Primary">
<button class="kh-link" aria-current="{{ shopCur }}" onClick="{{ goShop }}"><span>{{ shopLabel }}</span></button>
<button class="kh-link" aria-current="{{ customCur }}" onClick="{{ goCustom }}"><span>Custom Prints</span></button>
<button class="kh-link" aria-current="{{ aboutCur }}" onClick="{{ goAbout }}"><span>About</span></button>
</nav>
<div class="kh-search">
<label class="k-sr" for="kh-q">Search products</label>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m15.5 15.5 5 5"></path></svg>
<input id="kh-q" type="search" placeholder="Search products..." value="{{ query }}" onChange="{{ onQuery }}">
</div>
</div>
<sc-if value="{{ isFurry }}" hint-placeholder-val="{{ false }}"><button class="kh-mode" onClick="{{ onToggleMode }}" aria-label="Switch to Human Mode"><span>Human Mode</span><img src="project/assets/f4d78f782107b41b1cafad4d61165d61.svg" alt="" width="18" height="18"></button></sc-if>
<div class="kh-cartwrap">
<button class="kh-icon" onClick="{{ onCart }}" aria-label="View cart, {{ cartCount }} items">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5h3l2.4 11.2a1.5 1.5 0 0 0 1.5 1.2h8.2a1.5 1.5 0 0 0 1.5-1.1L20.8 8H6.4"></path><circle cx="9.5" cy="20" r="1.4"></circle><circle cx="17" cy="20" r="1.4"></circle></svg>
<sc-if value="{{ hasCount }}" hint-placeholder-val="{{ false }}"><span class="kh-count" aria-hidden="true">{{ cartCount }}</span></sc-if>
</button>
</div>
<button class="kh-icon kh-burger" onClick="{{ toggleMenu }}" aria-label="Menu" aria-expanded="{{ menuOpen }}" aria-controls="kh-menu">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"></path></svg>
</button>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","shop","custom","about"],"default":"shop"},"cartCount":{"editor":"int","default":2},"query":{"editor":null},"onHome":{"editor":null},"onShop":{"editor":null},"onCustom":{"editor":null},"onAbout":{"editor":null},"onCart":{"editor":null},"onQuery":{"editor":null},"furry":{"editor":"boolean","default":false},"onToggleMode":{"editor":null},"$preview":{"width":1440,"height":160}}'>
class Component extends DCLogic {
  state = { menuOpen: false };
  renderVals() {
    const p = this.props;
    const active = p.active || 'shop';
    const noop = () => {};
    const go = (fn) => () => { this.setState({ menuOpen: false }); (fn || noop)(); };
    const cur = (k) => (active === k ? 'page' : undefined);
    const n = p.cartCount === undefined ? 0 : p.cartCount;
    return {
      menuOpen: this.state.menuOpen,
      menuCls: this.state.menuOpen ? 'kh-open' : '',
      toggleMenu: () => this.setState({ menuOpen: !this.state.menuOpen }),
      goHome: go(p.onHome), goShop: go(p.onShop), goCustom: go(p.onCustom), goAbout: go(p.onAbout),
      onCart: p.onCart || noop,
      isFurry: !!p.furry, shopLabel: p.furry ? 'The Den' : 'Shop',
      onToggleMode: go(p.onToggleMode),
      shopCur: cur('shop'), customCur: cur('custom'), aboutCur: cur('about'),
      cartCount: n, hasCount: n > 0,
      query: p.query || '',
      onQuery: p.onQuery || noop
    };
  }
}
</script>
</body>
</html>
