<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kokuro Filter Panel</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
<link rel="stylesheet" href="./theme/human.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.kfp{color:var(--k-ink);font-family:var(--k-font-body)}
.kfp *{box-sizing:border-box}
.kfp-h{margin:0 0 14px;font-family:var(--k-font-display);font-style:italic;font-weight:400;font-size:32px;line-height:1;letter-spacing:.03em;text-transform:uppercase}
.kfp-cats{display:flex;flex-direction:column;gap:2px;margin:0 0 28px;padding:0 0 28px;list-style:none;border-bottom:1px solid var(--k-line-strong)}
.kfp-cat{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:44px;padding:0 12px;background:none;border:0;text-align:left;font-size:15px;font-weight:600;color:var(--k-ink-soft);transition:background .2s,color .2s}
.kfp-cat:hover{background:var(--k-surface);color:var(--k-ink)}
.kfp-cat[aria-current="true"]{background:var(--k-accent);color:var(--k-on-accent);clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.kfp-cat span:last-child{font-size:13px;font-weight:700;opacity:.85}
.kfp-sec{border-bottom:1px solid var(--k-line-strong);padding:4px 0 18px;margin-bottom:12px}
.kfp-sec summary{display:flex;align-items:center;justify-content:space-between;min-height:46px;list-style:none;font-size:14px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
.kfp-sec summary::-webkit-details-marker{display:none}
.kfp-sec summary svg{transition:transform .2s}
.kfp-sec[open] summary svg{transform:rotate(180deg)}
.kfp-sec summary:focus-visible{outline:3px solid var(--k-ink);outline-offset:3px}
.kfp-range{width:100%;height:44px;margin:4px 0 0;background:transparent;accent-color:var(--k-accent)}
.kfp-ends{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.kfp-sw{display:flex;flex-wrap:wrap;gap:2px}
.kfp-sz{display:flex;flex-wrap:wrap;gap:8px}
.kfp-clear{margin-top:6px;min-height:44px;padding:0;background:none;border:0;font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--k-accent-text);text-decoration:underline;text-underline-offset:5px}
</style>
</helmet>
<div class="kfp k-root" style="min-height: 0">
<h2 class="kfp-h">Categories</h2>
<ul class="kfp-cats">
<sc-for list="{{ categories }}" as="c" hint-placeholder-count="6">
<li><button class="kfp-cat" aria-current="{{ c.current }}" onClick="{{ c.select }}"><span>{{ c.label }}</span><span>{{ c.countLabel }}</span></button></li>
</sc-for>
</ul>

<h2 class="kfp-h">Filters</h2>
<details class="kfp-sec" open="">
<summary>Price <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"></path></svg></summary>
<label class="k-sr" for="kfp-price">Maximum price</label>
<input id="kfp-price" class="kfp-range" type="range" min="{{ priceMin }}" max="{{ priceMax }}" step="1" value="{{ priceValue }}" onChange="{{ onPrice }}">
<div class="kfp-ends"><span>{{ priceMinLabel }}</span><span>Up to {{ priceValueLabel }}</span></div>
</details>
<details class="kfp-sec" open="">
<summary>Color <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"></path></svg></summary>
<div class="kfp-sw" role="group" aria-label="Color">
<sc-for list="{{ colors }}" as="c" hint-placeholder-count="4">
<button class="k-swatch" aria-pressed="{{ c.pressed }}" aria-label="{{ c.label }}" title="{{ c.label }}" onClick="{{ c.select }}"><i style="background: {{ c.hex }}"></i></button>
</sc-for>
</div>
</details>
<details class="kfp-sec" open="">
<summary>Size <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"></path></svg></summary>
<div class="kfp-sz" role="group" aria-label="Size">
<sc-for list="{{ sizes }}" as="s" hint-placeholder-count="6">
<button class="k-chip k-chip--sm" aria-pressed="{{ s.pressed }}" onClick="{{ s.select }}"><span>{{ s.label }}</span></button>
</sc-for>
</div>
</details>
<sc-if value="{{ hasActive }}" hint-placeholder-val="{{ false }}"><button class="kfp-clear" onClick="{{ onClear }}">Clear filters</button></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"model":{"editor":null},"$preview":{"width":320,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const noop = () => {};
    const m = this.props.model || {
      categories: [
        { label: 'All Products', countLabel: '10', current: true, select: noop },
        { label: 'T-Shirts', countLabel: '2', current: false, select: noop },
        { label: 'Hoodies', countLabel: '1', current: false, select: noop }
      ],
      priceMin: 8, priceMax: 58, priceValue: 58, priceMinLabel: '$8', priceValueLabel: '$58', onPrice: noop,
      colors: [{ label: 'Black', hex: '#111111', pressed: false, select: noop }, { label: 'Crimson', hex: '#8E1119', pressed: true, select: noop }],
      sizes: [{ label: 'S', pressed: false, select: noop }, { label: 'M', pressed: true, select: noop }, { label: 'L', pressed: false, select: noop }],
      hasActive: true, onClear: noop
    };
    return m;
  }
}
</script>
</body>
</html>
