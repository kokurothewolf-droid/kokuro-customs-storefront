<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kokuro Cart Drawer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.kcw-scrim{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.62)}
.kcw-panel{position:fixed;top:0;right:0;bottom:0;z-index:91;display:flex;flex-direction:column;width:min(460px,100vw);background:#0B0B0B;color:#F5F2ED;border-left:2px solid #D71925;font-family:'Montserrat',system-ui,sans-serif;box-sizing:border-box}
.kcw-panel *{box-sizing:border-box}
@media (prefers-reduced-motion:no-preference){.kcw-panel{animation:kcw-in .32s cubic-bezier(.2,.8,.2,1) both}.kcw-scrim{animation:kcw-fade .3s both}@keyframes kcw-in{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}@keyframes kcw-fade{from{opacity:0}to{opacity:1}}}
.kcw-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 24px;border-bottom:1px solid #2A2A2A}
.kcw-title{margin:0;font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-style:italic;font-size:40px;line-height:1;letter-spacing:.02em;text-transform:uppercase}
.kcw-title span{color:#FF5A4D}
.kcw-x{width:46px;height:46px;display:inline-flex;align-items:center;justify-content:center;background:none;border:1px solid #3A3A3A;color:#F5F2ED;cursor:pointer}
.kcw-x:hover{background:#F5F2ED;color:#0B0B0B}
.kcw-list{flex:1;overflow-y:auto;padding:8px 24px}
.kcw-line{display:grid;grid-template-columns:84px minmax(0,1fr);gap:16px;padding:18px 0;border-bottom:1px solid #2A2A2A}
.kcw-thumb{position:relative;width:84px;height:104px;padding:0;border:0;background:#1A1A1A;overflow:hidden;cursor:pointer;clip-path:polygon(12% 0,100% 0,88% 100%,0 100%)}
.kcw-thumb img{display:block;width:100%;height:100%;object-fit:cover}
.kcw-thumb .kcw-art{display:flex;align-items:center;justify-content:center;width:100%;height:100%;background-color:#101010;background-image:url(./assets/fc35f148840560cbd9f2bc097d49f2f2.svg);background-size:300px 200px}
.kcw-thumb .kcw-art img{width:60%;height:60%;object-fit:contain}
.kcw-name{margin:0;font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-style:italic;font-size:26px;line-height:1;letter-spacing:.02em;text-transform:uppercase}
.kcw-name button{padding:0;border:0;background:none;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;text-align:left;cursor:pointer}
.kcw-name button:hover{text-decoration:underline;text-decoration-color:#D71925;text-decoration-thickness:3px;text-underline-offset:4px}
.kcw-meta{margin:6px 0 0;font-size:13px;color:#C9C5BE}
.kcw-notes{margin:6px 0 0;font-size:12px;line-height:1.5;color:#9A9A9A;font-style:italic;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kcw-ctl{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.kcw-step{display:inline-flex;align-items:center;border:1px solid #3A3A3A}
.kcw-step button{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;background:none;border:0;color:#F5F2ED;cursor:pointer}
.kcw-step button:hover:not(:disabled){background:#F5F2ED;color:#0B0B0B}
.kcw-step button:disabled{color:#5A5A5A;cursor:not-allowed}
.kcw-step output{min-width:36px;text-align:center;font-size:15px;font-weight:700}
.kcw-total{font-size:17px;font-weight:700}
.kcw-rm{min-height:44px;padding:0 4px;background:none;border:0;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#9A9A9A;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.kcw-rm:hover{color:#FF5A4D}
.kcw-empty{display:flex;flex-direction:column;align-items:flex-start;gap:20px;padding:56px 0}
.kcw-empty h3{margin:0;font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-style:italic;font-size:56px;line-height:.92;text-transform:uppercase}
.kcw-empty p{margin:0;font-size:15px;line-height:1.6;color:#C9C5BE;max-width:30ch}
.kcw-foot{padding:20px 24px 24px;border-top:1px solid #2A2A2A;background:#101010}
.kcw-sub{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.kcw-sub b{font-size:24px;letter-spacing:0}
.kcw-fine{margin:8px 0 16px;font-size:12px;line-height:1.5;color:#9A9A9A}
.kcw-btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;background:#D71925;color:#F5F2ED;border:0;font-family:'Bebas Neue',Impact,sans-serif;font-style:italic;font-size:25px;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;transition:background .2s,color .2s}
.kcw-btn:hover:not(:disabled){background:#F5F2ED;color:#0B0B0B}
.kcw-btn:disabled{background:#2A2A2A;color:#9A9A9A;cursor:not-allowed}
.kcw-btn.kcw-ghost{background:transparent;box-shadow:inset 0 0 0 2px #F5F2ED;width:auto;padding:0 32px}
.kcw-btn.kcw-ghost:hover{background:#F5F2ED;color:#0B0B0B}
.kcw-panel button:focus-visible{outline:3px solid #F5F2ED;outline-offset:3px}
</style>
</helmet>
<sc-if value="{{ isOpen }}" hint-placeholder-val="{{ false }}">
<div class="kcw-scrim" onClick="{{ onClose }}"></div>
<aside class="kcw-panel" role="dialog" aria-modal="true" aria-labelledby="kcw-h">
<div class="kcw-head">
<h2 id="kcw-h" class="kcw-title">Your cart <span>({{ count }})</span></h2>
<button class="kcw-x" onClick="{{ onClose }}" aria-label="Close cart"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19"></path></svg></button>
</div>
<div class="kcw-list">
<sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
<div class="kcw-empty">
<h3>Nothing<br>hunted yet.</h3>
<p>Your cart is empty. Find a piece worth carrying.</p>
<button class="kcw-btn kcw-ghost" onClick="{{ onShop }}">Browse the shop</button>
</div>
</sc-if>
<sc-for list="{{ lines }}" as="l" hint-placeholder-count="2">
<div class="kcw-line">
<button class="kcw-thumb" onClick="{{ l.open }}" aria-label="View {{ l.name }}">
<sc-if value="{{ l.hasPhoto }}" hint-placeholder-val="{{ true }}"><img src="{{ l.image }}" alt="" style="object-position: {{ l.imagePos }}"></sc-if>
<sc-if value="{{ l.noPhoto }}" hint-placeholder-val="{{ false }}"><span class="kcw-art"><img src="{{ l.artUrl }}" alt=""></span></sc-if>
</button>
<div>
<h3 class="kcw-name"><button onClick="{{ l.open }}">{{ l.name }}</button></h3>
<p class="kcw-meta">{{ l.variantLabel }} · {{ l.unitLabel }}</p>
<sc-if value="{{ l.hasNotes }}" hint-placeholder-val="{{ false }}"><p class="kcw-notes">{{ l.notes }}</p></sc-if>
<div class="kcw-ctl">
<div class="kcw-step" role="group" aria-label="Quantity for {{ l.name }}">
<button onClick="{{ l.dec }}" disabled="{{ l.decDisabled }}" aria-label="Decrease quantity"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<output aria-live="polite">{{ l.qty }}</output>
<button onClick="{{ l.inc }}" aria-label="Increase quantity"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<span class="kcw-total">{{ l.totalLabel }}</span>
</div>
<button class="kcw-rm" onClick="{{ l.remove }}" aria-label="Remove {{ l.name }}">Remove</button>
</div>
</div>
</sc-for>
</div>
<div class="kcw-foot">
<div class="kcw-sub"><span>Subtotal</span><b>{{ subtotalLabel }}</b></div>
<p class="kcw-fine">Shipping and taxes are calculated at checkout.</p>
<button class="kcw-btn" onClick="{{ onViewCart }}">View cart</button>
<button class="kcw-btn kcw-ghost" onClick="{{ onClose }}" style="width: 100%; margin-top: 10px; min-height: 48px">Continue shopping</button>
</div>
</aside>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"open":{"editor":"boolean","default":true},"lines":{"editor":null},"count":{"editor":"int","default":2},"subtotalLabel":{"editor":null},"onClose":{"editor":null},"onShop":{"editor":null},"onViewCart":{"editor":null},"$preview":{"width":460,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const standalone = p.lines === undefined;
    const lines = (p.lines || (standalone ? [
      { lineId: 'a', name: 'Lone Wolf Tee', variantLabel: 'M', unitLabel: '$28.00 each', totalLabel: '$56.00', qty: 2, hasPhoto: true, noPhoto: false, image: './assets/f8ffea6161a75f8f8fa77b8ccf954b74.webp', imagePos: '50% 40%', artUrl: '', notes: '', hasNotes: false, canDec: true, inc: () => {}, dec: () => {}, remove: () => {}, open: () => {} },
      { lineId: 'b', name: 'Claw Slash Decal', variantLabel: 'Single decal', unitLabel: '$8.00 each', totalLabel: '$8.00', qty: 1, hasPhoto: false, noPhoto: true, image: '', imagePos: '', artUrl: './assets/93eba917cff886a4ae1ea570c6b387ab.svg', notes: '', hasNotes: false, canDec: false, inc: () => {}, dec: () => {}, remove: () => {}, open: () => {} }
    ] : [])).map((l) => ({ ...l, noPhoto: !l.hasPhoto, decDisabled: !l.canDec }));
    return {
      isOpen: p.open === undefined ? true : !!p.open,
      lines,
      isEmpty: lines.length === 0,
      count: p.count === undefined ? (standalone ? 3 : 0) : p.count,
      subtotalLabel: p.subtotalLabel || (standalone ? '$64.00' : '$0.00'),
      onClose: p.onClose || (() => {}),
      onShop: p.onShop || (() => {}),
      onViewCart: p.onViewCart || (() => {})
    };
  }
}
</script>
</body>
</html>
