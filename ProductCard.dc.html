<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kokuro Product Card</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
<link rel="stylesheet" href="./theme/human.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
.kcc{position:relative;display:flex;flex-direction:column;height:100%;background:var(--k-surface);border:1px solid var(--k-line);color:var(--k-ink);font-family:var(--k-font-body);clip-path:polygon(0 0,100% 0,100% calc(100% - 20px),calc(100% - 20px) 100%,0 100%);transition:border-color .25s,transform .25s}
.kcc *{box-sizing:border-box}
.kcc:hover{border-color:var(--k-accent);transform:translateY(-4px)}
.kcc-media{position:relative;display:block;width:100%;padding:0;border:0;background:var(--k-surface-2);overflow:hidden;aspect-ratio:4/5}
.kcc-photo{display:block;width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.kcc:hover .kcc-photo{transform:scale(1.05)}
.kcc-artbox{position:absolute;inset:0}
.kcc-artbox img{transition:transform .5s ease}
.kcc:hover .kcc-artbox img{transform:scale(1.08) rotate(-3deg)}
.kcc-scrim{position:absolute;left:0;right:0;bottom:0;padding:70px 18px 14px;background:linear-gradient(0deg,rgba(11,11,11,.96) 0%,rgba(11,11,11,.7) 55%,rgba(11,11,11,0) 100%);text-align:left}
.kcc-slashes{position:absolute;right:14px;bottom:14px;width:34px;height:auto;opacity:.95}
.kcc-cat{margin:0 0 6px;font-size:11px;line-height:1;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--k-ink-dim)}
.kcc-name{margin:0;font-family:var(--k-font-display);font-weight:400;font-style:italic;font-size:32px;line-height:1;letter-spacing:.02em;text-transform:uppercase}
.kcc-name button{padding:0;border:0;background:none;text-align:left;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit}
.kcc-name button:hover{text-decoration:underline;text-decoration-color:var(--k-accent);text-decoration-thickness:3px;text-underline-offset:5px}
.kcc-concept{position:absolute;right:10px;top:10px;padding:4px 8px;background:rgba(11,11,11,.85);color:var(--k-ink-dim);font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.kcc-tag{position:absolute;top:14px;left:0}
.kcc-body{display:flex;flex-direction:column;gap:12px;flex:1;padding:14px 18px 22px}
.kcc-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.kcc-price{font-size:18px;font-weight:700}
.kcc-dots{display:flex;gap:6px}
.kcc-dots i{display:block;width:16px;height:16px;border-radius:50%;border:1px solid var(--k-ink-dim)}
.kcc-sizes{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.kcc-sizes li{min-width:34px;padding:5px 8px;border:1px solid var(--k-line-strong);font-size:11px;font-weight:700;letter-spacing:.06em;text-align:center;color:var(--k-ink-dim)}
.kcc-row{margin-top:auto;display:flex;justify-content:flex-end}
.kcc.kcc-list{flex-direction:row}
.kcc.kcc-list .kcc-media{width:220px;flex:none;aspect-ratio:1/1;height:auto}
.kcc.kcc-list .kcc-body{justify-content:center;padding:20px 24px}
@media (max-width:560px){.kcc.kcc-list{flex-direction:column}.kcc.kcc-list .kcc-media{width:100%;aspect-ratio:4/5}}
</style>
</helmet>
<article class="kcc {{ layoutCls }}">
<button class="kcc-media" data-k-tilt="2.5" onClick="{{ open }}" aria-label="View {{ name }}" style="background: {{ bg }}">
<sc-if value="{{ hasPhoto }}" hint-placeholder-val="{{ true }}"><img class="kcc-photo" src="{{ image }}" alt="" style="object-position: {{ imagePos }}; object-fit: {{ fit }}"></sc-if>
<sc-if value="{{ noPhoto }}" hint-placeholder-val="{{ false }}"><span class="kcc-artbox k-art"><img src="{{ artUrl }}" alt=""></span><span class="kcc-concept">Concept art</span></sc-if>
<sc-if value="{{ hasTag }}" hint-placeholder-val="{{ false }}"><span class="k-tag kcc-tag">{{ tag }}</span></sc-if>
<span class="kcc-scrim"><p class="kcc-cat">{{ categoryLabel }}</p></span>
<img class="kcc-slashes" src="./assets/c683f776b1f40ef9917a32ae1dec467e.svg" alt="">
</button>
<div class="kcc-body">
<h3 class="kcc-name"><button onClick="{{ open }}">{{ name }}</button></h3>
<div class="kcc-top">
<span class="kcc-price">{{ priceLabel }}</span>
<div class="kcc-dots" aria-label="{{ colorAria }}">
<sc-for list="{{ swatches }}" as="c" hint-placeholder-count="3"><i style="background: {{ c.hex }}" title="{{ c.label }}"></i></sc-for>
</div>
</div>
<ul class="kcc-sizes" aria-label="Sizes">
<sc-for list="{{ sizeLabels }}" as="s" hint-placeholder-count="5"><li>{{ s }}</li></sc-for>
</ul>
<div class="kcc-row">
<button class="k-btn k-btn--sm" onClick="{{ act }}" aria-label="{{ cta }}: {{ name }}"><span>{{ cta }}</span></button>
</div>
</div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"item":{"editor":null},"layout":{"editor":"enum","options":["grid","list"],"default":"grid"},"$preview":{"width":360,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    const it = this.props.item || {
      name: 'Lone Wolf Tee', categoryLabel: 'T-Shirts', priceLabel: '$28.00',
      hasPhoto: true, image: './assets/f8ffea6161a75f8f8fa77b8ccf954b74.webp', imagePos: '50% 40%',
      artUrl: '', tag: 'New',
      swatches: [{ hex: '#111111', label: 'Black' }, { hex: '#E9E3D8', label: 'Bone' }, { hex: '#8E1119', label: 'Crimson' }],
      sizeLabels: ['S', 'M', 'L', 'XL', '2XL'], cta: 'Options'
    };
    const sw = it.swatches || [];
    return {
      layoutCls: this.props.layout === 'list' ? 'kcc-list' : '',
      name: it.name, categoryLabel: it.categoryLabel, priceLabel: it.priceLabel,
      hasPhoto: !!it.hasPhoto, noPhoto: !it.hasPhoto,
      fit: it.fit || 'cover', bg: it.bg || 'var(--k-surface-2)',
      image: it.image || '', imagePos: it.imagePos || '50% 50%', artUrl: it.artUrl || '',
      tag: it.tag || '', hasTag: !!it.tag,
      swatches: sw, colorAria: sw.length > 1 ? 'Colors: ' + sw.map((c) => c.label).join(', ') : 'Color: ' + (sw[0] ? sw[0].label : ''),
      sizeLabels: it.sizeLabels || [],
      cta: it.cta || 'Options',
      open: it.open || (() => {}), act: it.act || (() => {})
    };
  }
}
</script>
</body>
</html>
