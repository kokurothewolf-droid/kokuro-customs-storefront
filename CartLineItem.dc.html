<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kokuro Cart Line Item</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./theme/human.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.kl{display:grid;grid-template-columns:minmax(0,1fr) 110px 150px 110px 44px;gap:20px;align-items:center;padding:18px 0;border-bottom:1px solid var(--k-line-strong);color:var(--k-ink);font-family:var(--k-font-body)}
.kl *{box-sizing:border-box}
.kl-item{display:flex;align-items:center;gap:22px;min-width:0}
.kl-thumb{flex:none;position:relative;width:132px;height:112px;padding:0;border:0;background:var(--k-surface);overflow:hidden}
.kl-thumb img{width:100%;height:100%;object-fit:cover}
.kl-thumb .k-art{width:100%;height:100%;background-size:300px 200px}
.kl-thumb .k-art img{width:58%;height:58%;object-fit:contain}
.kl-name{margin:0;font-family:var(--k-font-display);font-weight:400;font-style:italic;font-size:32px;line-height:1;letter-spacing:.02em;text-transform:uppercase}
.kl-name button{padding:0;border:0;background:none;text-align:left;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit}
.kl-name button:hover{text-decoration:underline;text-decoration-color:var(--k-accent);text-decoration-thickness:3px;text-underline-offset:5px}
.kl-meta{margin:6px 0 0;font-size:14px;color:var(--k-ink-dim)}
.kl-mark{display:block;width:34px;height:auto;margin-top:8px}
.kl-price,.kl-total{font-size:18px;font-weight:700}
.kl-step{display:inline-flex;align-items:center;border:1px solid var(--k-ink-dim);height:46px}
.kl-step button{width:44px;height:100%;display:inline-flex;align-items:center;justify-content:center;background:none;border:0}
.kl-step button:hover:not(:disabled){background:var(--k-ink);color:var(--k-on-cream)}
.kl-step button:disabled{color:#5A5A5A;cursor:not-allowed}
.kl-step output{min-width:40px;text-align:center;font-size:16px;font-weight:700}
.kl-rm{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;background:none;border:0;color:var(--k-ink)}
.kl-rm:hover{color:var(--k-accent-text)}
.kl-lbl{display:none}
.kl button:focus-visible{outline:3px solid var(--k-ink);outline-offset:3px}
@media (max-width:860px){
.kl{grid-template-columns:minmax(0,1fr) auto;gap:14px 12px}
.kl-item{grid-column:1 / -1}
.kl-thumb{width:96px;height:96px}
.kl-name{font-size:28px}
.kl-price{display:none}
.kl-lbl{display:inline;margin-right:8px;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--k-muted)}
.kl-qty{grid-column:1}
.kl-total{grid-column:2;justify-self:end}
.kl-rmw{position:absolute;right:0;top:12px}
.kl{position:relative}
}
</style>
</helmet>
<div class="kl">
<div class="kl-item">
<button class="kl-thumb" onClick="{{ open }}" aria-label="View {{ name }}">
<sc-if value="{{ hasPhoto }}" hint-placeholder-val="{{ true }}"><img src="{{ image }}" alt="" style="object-position: {{ imagePos }}"></sc-if>
<sc-if value="{{ noPhoto }}" hint-placeholder-val="{{ false }}"><span class="k-art"><img src="{{ artUrl }}" alt=""></span></sc-if>
</button>
<div>
<h3 class="kl-name"><button onClick="{{ open }}">{{ name }}</button></h3>
<p class="kl-meta">{{ variantLabel }}</p>
<img class="kl-mark" src="./assets/c683f776b1f40ef9917a32ae1dec467e.svg" alt="">
</div>
</div>
<div class="kl-price">{{ unitPrice }}</div>
<div class="kl-qty">
<div class="kl-step" role="group" aria-label="Quantity for {{ name }}">
<button onClick="{{ dec }}" disabled="{{ decDisabled }}" aria-label="Decrease quantity"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<output aria-live="polite">{{ qty }}</output>
<button onClick="{{ inc }}" aria-label="Increase quantity"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
</div>
<div class="kl-total"><span class="kl-lbl">Total</span>{{ total }}</div>
<div class="kl-rmw"><button class="kl-rm" onClick="{{ remove }}" aria-label="Remove {{ name }} from cart"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19"></path></svg></button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"line":{"editor":null},"$preview":{"width":1000,"height":220}}'>
class Component extends DCLogic {
  renderVals() {
    const noop = () => {};
    const l = this.props.line || {
      name: 'Lone Wolf Tee', variantLabel: 'Color: Black  |  Size: L', unitLabel: '$28.00', totalLabel: '$28.00', qty: 1,
      hasPhoto: true, image: './assets/f8ffea6161a75f8f8fa77b8ccf954b74.webp', imagePos: '50% 40%', artUrl: '', canDec: false
    };
    return {
      name: l.name, variantLabel: l.variantLabel,
      hasPhoto: !!l.hasPhoto, noPhoto: !l.hasPhoto, image: l.image || '', imagePos: l.imagePos || '50% 50%', artUrl: l.artUrl || '',
      unitPrice: (l.unitLabel || '').replace(' each', ''), total: l.totalLabel, qty: l.qty,
      decDisabled: !l.canDec,
      inc: l.inc || noop, dec: l.dec || noop, remove: l.remove || noop, open: l.open || noop
    };
  }
}
</script>
</body>
</html>
