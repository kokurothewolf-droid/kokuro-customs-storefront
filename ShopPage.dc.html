<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kokuro Shop Page</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
<link rel="stylesheet" href="./theme/human.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Montserrat:wght@400;500;600;700;800&amp;family=Noto+Serif+JP:wght@900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.sp{color:var(--k-ink);font-family:var(--k-font-body)}
.sp-body{display:grid;grid-template-columns:272px minmax(0,1fr);gap:0 40px;padding-top:36px;padding-bottom:72px;align-items:start}
.sp-side{padding-right:32px;border-right:1px solid var(--k-line-strong)}
.sp-bar{display:flex;align-items:center;gap:14px 18px;flex-wrap:wrap;margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--k-line-strong)}
.sp-title{margin:0;margin-right:auto;font-size:34px;line-height:1}
.sp-title span{color:var(--k-ink-dim)}
.sp-sort{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--k-ink-dim)}
.sp-sort select{width:auto;min-width:170px;appearance:none;padding-right:36px;background-image:linear-gradient(45deg,transparent 50%,var(--k-ink) 50%),linear-gradient(135deg,var(--k-ink) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 14px) 21px;background-size:6px 6px;background-repeat:no-repeat}
.sp-view{display:flex;gap:6px}
.sp-view button{width:48px;height:48px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--k-line-strong);color:var(--k-ink)}
.sp-view button[aria-pressed="true"]{background:var(--k-accent);border-color:var(--k-accent);color:var(--k-on-accent)}
.sp-filters-btn{display:none}
.sp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:22px}
.sp-grid.sp-list{grid-template-columns:minmax(0,1fr)}
.sp-cell{display:flex;flex-direction:column;min-width:0}
.sp-cell>*{flex:1 1 auto;min-width:0}
.sp-empty{padding:56px 0 72px}
.sp-empty h2{margin:0 0 20px;font-size:clamp(48px,6vw,88px);line-height:.9}
.sp-note{margin:34px 0 0;font-size:12px;line-height:1.6;color:var(--k-muted)}
@media (max-width:980px){
.sp-body{grid-template-columns:minmax(0,1fr);padding-top:20px}
.sp-side{display:none;padding:20px 20px 8px;margin-bottom:22px;border:1px solid var(--k-accent);border-right:1px solid var(--k-accent);background:var(--k-surface-2)}
.sp-side.sp-open{display:block}
.sp-filters-btn{display:inline-flex}
.sp-title{flex:1 1 100%;margin-right:0}
.sp-sort{flex:1 1 auto}
.sp-sort select{min-width:0;flex:1}
}
</style>
</helmet>
<div class="sp k-root" style="min-height: 0">
<dc-import name="PageBanner" title-a="{{ bannerA }}" title-b="{{ bannerB }}" subtitle="Apparel, accessories &amp; custom gear" art="mountain" hint-size="100%,300px"></dc-import>
<div class="k-wrap sp-body">
<aside class="sp-side {{ sideCls }}" data-k-reveal="fade" aria-label="Filters">
<dc-import name="FilterPanel" model="{{ filterModel }}" hint-size="100%,700px"></dc-import>
</aside>
<section aria-labelledby="sp-title">
<div class="sp-bar" data-k-reveal="rise">
<h2 id="sp-title" class="k-display sp-title">{{ listTitle }} <span>({{ count }})</span></h2>
<button class="k-chip sp-filters-btn" aria-expanded="{{ filtersOpen }}" onClick="{{ toggleFilters }}"><span>Filters</span></button>
<label class="sp-sort">Sort by
<select class="k-field" value="{{ sort }}" onChange="{{ onSort }}">
<option value="featured">Featured</option>
<option value="price-asc">Price: low to high</option>
<option value="price-desc">Price: high to low</option>
<option value="name">Name: A to Z</option>
</select>
</label>
<div class="sp-view" role="group" aria-label="Layout">
<button aria-pressed="{{ isGrid }}" aria-label="Grid view" onClick="{{ setGrid }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg></button>
<button aria-pressed="{{ isList }}" aria-label="List view" onClick="{{ setList }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h2M10 6h10M4 12h2M10 12h10M4 18h2M10 18h10"></path></svg></button>
</div>
</div>
<sc-if value="{{ hasResults }}" hint-placeholder-val="{{ true }}">
<div class="sp-grid {{ gridCls }}">
<sc-for list="{{ results }}" as="p" hint-placeholder-count="4">
<div class="sp-cell" data-k-reveal="rise"><dc-import name="ProductCard" item="{{ p }}" layout="{{ layout }}" hint-size="100%,600px"></dc-import></div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{ noResults }}" hint-placeholder-val="{{ false }}">
<div class="sp-empty">
<h2 class="k-display">Nothing in the <span class="k-red">woods</span> matches.</h2>
<button class="k-btn" onClick="{{ onClear }}"><span>Clear filters</span></button>
</div>
</sc-if>
<p class="sp-note">Demo catalog: products, prices, counts and stock are mock data, and the photos are concept imagery. Payments and fulfillment are not connected yet.</p>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bannerA":{"editor":null},"bannerB":{"editor":null},"filterModel":{"editor":null},"results":{"editor":null},"layout":{"editor":"enum","options":["grid","list"],"default":"grid"},"sort":{"editor":null},"onSort":{"editor":null},"onLayout":{"editor":null},"onClear":{"editor":null},"$preview":{"width":1440,"height":2200}}'>
class Component extends DCLogic {
  state = { filtersOpen: false };
  renderVals() {
    const p = this.props;
    const noop = () => {};
    const results = p.results || [];
    const layout = p.layout === 'list' ? 'list' : 'grid';
    return {
      bannerA: p.bannerA === undefined ? 'Shop the' : p.bannerA,
      bannerB: p.bannerB === undefined ? 'Collection' : p.bannerB,
      filterModel: p.filterModel, // undefined makes FilterPanel render its demo model
      results, count: results.length,
      listTitle: p.listTitle || 'All products',
      hasResults: results.length > 0, noResults: results.length === 0,
      layout, isGrid: layout === 'grid', isList: layout === 'list',
      gridCls: layout === 'list' ? 'sp-list' : '',
      setGrid: () => (p.onLayout || noop)('grid'),
      setList: () => (p.onLayout || noop)('list'),
      sort: p.sort || 'featured', onSort: p.onSort || noop, onClear: p.onClear || noop,
      filtersOpen: this.state.filtersOpen,
      sideCls: this.state.filtersOpen ? 'sp-open' : '',
      toggleFilters: () => this.setState({ filtersOpen: !this.state.filtersOpen })
    };
  }
}
</script>
</body>
</html>
